[package]
name = "geesefs-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "Apache-2.0"
description = "Unaccepted Linux/S3 GeeseFS rewrite under development"
repository = "https://github.com/borislitv/geesefs-rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
async-trait = "0.1"
aws-config = { version = "=1.13.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-smithy-async = "=1.3.1"
aws-sdk-s3 = { version = "=1.155.0", default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }
aws-smithy-types = "=1.9.0"
aws-smithy-runtime-api = "=1.19.1"
aws-runtime = "=1.10.2"
base64 = "0.22"
md-5 = "0.10"
humantime = "2"
mime = "0.3"
serde_json = "1"
http = "1"
http-body = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
s3s-sigv2 = "=0.17.0"
bytes = "=1.12.1"
fuser = "=0.18.0"
libc = "0.2"
rustix = { version = "=1.1.5", features = ["process"] }
tikv-jemallocator = { version = "=0.7.0", features = ["stats"] }
tikv-jemalloc-ctl = { version = "=0.7.0", features = ["stats"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
clap = { version = "4", features = ["derive"] }
moka = { version = "=0.12.16", features = ["sync"] }
percent-encoding = "2"
quick-xml = { version = "=0.42.0", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
unicode-general-category = "=1.1.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

[dev-dependencies]
crc32fast = "1"
rcgen = "0.14"
tempfile = "3"
tokio = { version = "=1.54.1", features = ["process"] }
flate2 = "1"
tiny_http = { version = "=0.12.0", features = ["ssl-rustls"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
